<!doctype html>

  </head>

    <nav>
      <div class="logo">BRAND</div>
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="#">Search</a></li>

      </ul>
    </nav>
    <div class="container">
      <h1>Shoes Fashion</h1>
      <div class="grid">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900&auto=format&fit=crop&q=60"
            alt="Running Sneakers"
          />

        <div class="card">
          <img

        </div>
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=900&auto=format&fit=crop&q=60"

          />
          <h3>Casual Canvas Shoes</h3>
          <p class="price">$39.99</p>
          <button class="btn">Add to Cart</button>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=900&auto=format&fit=crop&q=60"

          />
          <h3>Formal Oxford Shoes</h3>
          <p class="price">$89.99</p>
          <button class="btn">Add to Cart</button>
        </div>
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=900&auto=format&fit=crop&q=60"
            alt="Sporty Trainers"
          />
          <h3>Sporty Trainers</h3>
          <p class="price">$75.00</p>
          <button class="btn">Add to Cart</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
